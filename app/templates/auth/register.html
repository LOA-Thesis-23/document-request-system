<div id="signup-view" style="display: none;">
    <h1>Register</h1>
    <form method="POST" action="{{ url_for('auth.register') }}">
        <label>Full Name:</label><br>
        <input type="text" name="full_name" required><br><br>

        <!--label>First Name:</label><br>
        <input type="text" name="first_name" required><br><br>

        <label>Last Name:</label><br>
        <input type="text" name="last_name" required><br><br>

        <label>Middle Name:</label><br>
        <input type="text" name="middle_name" required><br><br-->

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Birthdate:</label><br>
        <input type="date" name="birthdate" required><br><br>

        <label>Student Number (optional):</label><br>
        <input type="text" name="student_number"><br><br>

        <label>Student Type:</label><br>
        <select name="student_type" required>
            <option value="" disabled selected>Select type</option>
            <option value="Current/Enrolled">Current/Enrolled</option>
            <option value="Graduate/Alumnus">Graduate/Alumnus</option>
            <option value="Transferee/Shiftee">Transferee/Shiftee</option>
            <option value="Inactive/LOA">Inactive/LOA</option>
        </select><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>

        <label>Confirm Password:</label><br>
        <input type="password" name="confirm_password" required><br><br>

        <button type="submit">Signup</button>
    </form>
    <button onclick="showLogin()">Already have an account? Login</button>
</div>
